<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="800" height="500" fill="#0a1019"/>
  <!-- terminal window -->
  <rect x="60" y="50" width="680" height="400" rx="10" fill="#0e1621"/>
  <rect x="60" y="50" width="680" height="40" rx="10" fill="#101a28"/>
  <circle cx="88" cy="70" r="6" fill="#243447"/>
  <circle cx="108" cy="70" r="6" fill="#243447"/>
  <circle cx="128" cy="70" r="6" fill="#243447"/>
  <text x="400" y="75" font-size="12" fill="#5c6b7f" text-anchor="middle">mcp-server — python 3.10</text>
  <!-- terminal lines -->
  <text x="88" y="124" font-size="13" fill="#5c6b7f">$ python mcp_server.py</text>
  <text x="88" y="156" font-size="13" fill="#22d3ee">[info]  MCP server started on stdio</text>
  <text x="88" y="186" font-size="13" fill="#22d3ee">[info]  registered tools: 8</text>
  <text x="88" y="216" font-size="13" fill="#93a1b3">-&gt; tools/call  process_tree.find_children(4502)</text>
  <text x="88" y="246" font-size="13" fill="#93a1b3">-&gt; tools/call  host.get_activity(&quot;10.x.x.12&quot;)</text>
  <text x="88" y="276" font-size="13" fill="#93a1b3">-&gt; tools/call  pcap.capture(&quot;tcpdump&quot;)</text>
  <text x="88" y="306" font-size="13" fill="#22d3ee">[ok]    investigation transcript written</text>
  <text x="88" y="336" font-size="13" fill="#5c6b7f">$ <tspan fill="#e6edf3">▌</tspan></text>
  <!-- placeholder note -->
  <rect x="88" y="366" width="624" height="60" rx="8" fill="#0a1019" stroke="#1e2a3a" stroke-dasharray="6 5"/>
  <text x="400" y="392" font-size="13" fill="#5c6b7f" text-anchor="middle">screenshot placeholder</text>
  <text x="400" y="412" font-size="11" fill="#3d4a5c" text-anchor="middle">replace with a real capture of the server in action</text>
  <text x="400" y="480" font-size="12" fill="#22d3ee" text-anchor="middle" opacity="0.7">MCP Tool Orchestration Server</text>
</svg>
