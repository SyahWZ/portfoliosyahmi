<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="800" height="500" fill="#0a1019"/>
  <!-- app window -->
  <rect x="60" y="50" width="680" height="400" rx="10" fill="#0e1621"/>
  <rect x="60" y="50" width="680" height="40" rx="10" fill="#101a28"/>
  <circle cx="88" cy="70" r="6" fill="#243447"/>
  <circle cx="108" cy="70" r="6" fill="#243447"/>
  <circle cx="128" cy="70" r="6" fill="#243447"/>
  <text x="400" y="75" font-size="12" fill="#5c6b7f" text-anchor="middle">tomato-leaf-disease — prediction</text>
  <!-- left: leaf image grid (2x3) -->
  <g>
    <rect x="92" y="116" width="96" height="96" rx="8" fill="#101a28"/>
    <rect x="200" y="116" width="96" height="96" rx="8" fill="#101a28"/>
    <rect x="92" y="224" width="96" height="96" rx="8" fill="#101a28"/>
    <rect x="200" y="224" width="96" height="96" rx="8" fill="#101a28" stroke="#22d3ee"/>
    <rect x="92" y="332" width="96" height="96" rx="8" fill="#101a28"/>
    <rect x="200" y="332" width="96" height="96" rx="8" fill="#101a28"/>
    <!-- leaf glyphs -->
    <g fill="#1e4d3a">
      <ellipse cx="140" cy="164" rx="26" ry="34"/>
      <ellipse cx="248" cy="164" rx="26" ry="34"/>
      <ellipse cx="140" cy="272" rx="26" ry="34"/>
      <ellipse cx="248" cy="272" rx="26" ry="34"/>
      <ellipse cx="140" cy="380" rx="26" ry="34"/>
      <ellipse cx="248" cy="380" rx="26" ry="34"/>
    </g>
  </g>
  <!-- right: result panel -->
  <rect x="328" y="116" width="380" height="312" rx="8" fill="#0a1019" stroke="#1e2a3a"/>
  <text x="352" y="152" font-size="13" fill="#93a1b3">prediction result</text>
  <text x="352" y="196" font-size="20" fill="#e6edf3">Late Blight</text>
  <text x="352" y="222" font-size="13" fill="#22d3ee">confidence 0.97</text>
  <!-- bars -->
  <rect x="352" y="252" width="300" height="10" rx="5" fill="#1e2a3a"/>
  <rect x="352" y="252" width="291" height="10" rx="5" fill="#22d3ee"/>
  <text x="352" y="286" font-size="11" fill="#5c6b7f">early blight  0.02</text>
  <rect x="352" y="296" width="300" height="10" rx="5" fill="#1e2a3a"/>
  <rect x="352" y="296" width="6" height="10" rx="3" fill="#22d3ee"/>
  <text x="352" y="330" font-size="11" fill="#5c6b7f">yellow leaf  0.01</text>
  <rect x="352" y="340" width="300" height="10" rx="5" fill="#1e2a3a"/>
  <rect x="352" y="340" width="2" height="10" rx="1" fill="#22d3ee"/>
  <!-- upload button -->
  <rect x="352" y="376" width="130" height="32" rx="6" fill="#22d3ee"/>
  <text x="417" y="397" font-size="12" fill="#06222b" text-anchor="middle">Upload image</text>
  <!-- placeholder note -->
  <text x="400" y="480" font-size="12" fill="#22d3ee" text-anchor="middle" opacity="0.7">Tomato Leaf Disease Detection — screenshot placeholder</text>
</svg>
